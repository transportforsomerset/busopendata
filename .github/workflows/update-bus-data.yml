name: Update Somerset Bus Data

on:
  workflow_dispatch:

concurrency:
  group: update-bus-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BODS_API_KEY: ${{ secrets.BODS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate bus data
        run: bun run update

      - name: Publish generated data
        run: |
          git config user.name "Transport for Somerset Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/buses.json docs/status.json docs/services.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update bus data [skip ci]"
          git push
