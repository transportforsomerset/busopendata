name: Get BODS Bus Data

on:
  workflow_call:
    secrets:
      BUS_DATA_API:
        required: true

concurrency:
  group: update-bus-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      BODS_API_KEY: ${{ secrets.BUS_DATA_API }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate BODS data
        run: bun run update

      - name: Generate MegaBus data
        run: bun run megabus

      - name: Prepare live data
        run: |
          cp docs/buses.json live/buses.json
          cp docs/status.json live/status.json
          cp docs/services.json live/services.json
          cp docs/generatedAt.json live/generatedAt.json
          cp data/operators.json live/operators.json

      - name: Publish generated data
        run: |
          git config user.name "Transport for Somerset Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/buses.json docs/status.json docs/services.json docs/generatedAt.json
          git add live/buses.json live/status.json live/services.json live/generatedAt.json live/operators.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update bus data [then deploy]"
          git push
