name: 4.1 - Generate Stops

on:
  workflow_dispatch:
  workflow_call: 

jobs:
  Fetch-Stop-Data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Stop Data
        run: bun run stops
