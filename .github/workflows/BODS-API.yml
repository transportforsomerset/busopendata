name: 3.1 - Test BODS Bus Data via the API

on:
  workflow_dispatch:
  workflow_call: 

jobs:
  Fetch-BODS-API-Data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate BODS bus Data
        run: bun run bods-api
        env:
          BODS_API_KEY: ${{ secrets.BUS_DATA_API }}
