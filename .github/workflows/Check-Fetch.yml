name: 3 - Test All Fetchers

on:
  workflow_dispatch:

concurrency:
  group: run-all
  cancel-in-progress: false

jobs:
  run-BODS-API-fetcher:
    name: Run BODS.yml
    uses: ./.github/workflows/BODS-API.yml
    secrets: inherit

  run-FLIX-fetcher:
    name: Run Flix.yml
    uses: ./.github/workflows/Flix.yml

  run-FALC-fetcher:
    name: Run FALC.yml
    uses: ./.github/workflows/FALC.yml
